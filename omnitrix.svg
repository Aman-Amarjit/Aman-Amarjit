<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Glow filter for the Omnitrix neon aesthetic -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-heavy" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- Radial gradient for the rotating green dial -->
    <radialGradient id="ringGrad" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#14532d" />
    </radialGradient>
  </defs>

  <!-- Outer Casing / Watch Body Base -->
  <circle cx="400" cy="400" r="380" fill="#111827" stroke="#374151" stroke-width="20" />
  <circle cx="400" cy="400" r="350" fill="#1f2937" stroke="#000000" stroke-width="8" />
  
  <!-- Outer metallic mechanical accents -->
  <path d="M 400 20 L 400 90" stroke="#4b5563" stroke-width="25" stroke-linecap="round"/>
  <path d="M 400 710 L 400 780" stroke="#4b5563" stroke-width="25" stroke-linecap="round"/>
  <path d="M 20 400 L 90 400" stroke="#4b5563" stroke-width="25" stroke-linecap="round"/>
  <path d="M 710 400 L 780 400" stroke="#4b5563" stroke-width="25" stroke-linecap="round"/>

  <!-- The Animated Dial (Rotates endlessly) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 400 400" to="360 400 400" dur="25s" repeatCount="indefinite"/>
    
    <!-- Glowing Green Ring -->
    <circle cx="400" cy="400" r="260" fill="none" stroke="url(#ringGrad)" stroke-width="110" filter="url(#glow)"/>
    
    <!-- Dividers for the Ring -->
    <line x1="400" y1="85" x2="400" y2="195" stroke="#111827" stroke-width="15" />
    <line x1="400" y1="605" x2="400" y2="715" stroke="#111827" stroke-width="15" />
    <line x1="85" y1="400" x2="195" y2="400" stroke="#111827" stroke-width="15" />
    <line x1="605" y1="400" x2="715" y2="400" stroke="#111827" stroke-width="15" />
    
    <!-- Diagonal Dividers -->
    <line x1="177" y1="177" x2="255" y2="255" stroke="#111827" stroke-width="15" />
    <line x1="623" y1="623" x2="545" y2="545" stroke="#111827" stroke-width="15" />
    <line x1="623" y1="177" x2="545" y2="255" stroke="#111827" stroke-width="15" />
    <line x1="177" y1="623" x2="255" y2="545" stroke="#111827" stroke-width="15" />

    <!-- Tech Stack Icons perfectly mapped around the Omnitrix Dial -->
    <!-- Positioned to face outward, substituting the alien silhouettes! -->
    
    <!-- 0 deg -->
    <g transform="translate(628, 368)"><image href="https://skillicons.dev/icons?i=react&amp;theme=dark" width="64" height="64" transform="rotate(90 32 32)" /></g>
    <!-- 45 deg -->
    <g transform="translate(552, 552)"><image href="https://skillicons.dev/icons?i=py&amp;theme=dark" width="64" height="64" transform="rotate(135 32 32)" /></g>
    <!-- 90 deg -->
    <g transform="translate(368, 628)"><image href="https://skillicons.dev/icons?i=docker&amp;theme=dark" width="64" height="64" transform="rotate(180 32 32)" /></g>
    <!-- 135 deg -->
    <g transform="translate(184, 552)"><image href="https://skillicons.dev/icons?i=nodejs&amp;theme=dark" width="64" height="64" transform="rotate(225 32 32)" /></g>
    <!-- 180 deg -->
    <g transform="translate(108, 368)"><image href="https://skillicons.dev/icons?i=fastapi&amp;theme=dark" width="64" height="64" transform="rotate(270 32 32)" /></g>
    <!-- 225 deg -->
    <g transform="translate(184, 184)"><image href="https://skillicons.dev/icons?i=mongodb&amp;theme=dark" width="64" height="64" transform="rotate(315 32 32)" /></g>
    <!-- 270 deg -->
    <g transform="translate(368, 108)"><image href="https://skillicons.dev/icons?i=tensorflow&amp;theme=dark" width="64" height="64" transform="rotate(0 32 32)" /></g>
    <!-- 315 deg -->
    <g transform="translate(552, 184)"><image href="https://skillicons.dev/icons?i=ts&amp;theme=dark" width="64" height="64" transform="rotate(45 32 32)" /></g>
  </g>

  <!-- Omnitrix Center Core (The Button) -->
  <circle cx="400" cy="400" r="190" fill="#050505" stroke="#111827" stroke-width="15" />
  
  <!-- The Classic Omnitrix Hourglass Logo -->
  <polygon points="260,260 540,260 400,400" fill="#22c55e" filter="url(#glow-heavy)"/>
  <polygon points="260,540 540,540 400,400" fill="#22c55e" filter="url(#glow-heavy)"/>
  <!-- Base polygon without glow to keep the center solid -->
  <polygon points="260,260 540,260 400,400" fill="#4ade80" />
  <polygon points="260,540 540,540 400,400" fill="#4ade80" />

  <!-- Core reflection / glass dome effect over the hourglass -->
  <circle cx="400" cy="400" r="190" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3" />
  <path d="M 230 300 A 170 170 0 0 1 570 300" fill="none" stroke="#ffffff" stroke-width="15" opacity="0.1" stroke-linecap="round" />
  <path d="M 260 250 A 140 140 0 0 1 540 250" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.2" stroke-linecap="round" />

</svg>
